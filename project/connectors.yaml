# Connectors — MCP-Server-Deklarationen
#
# Deklariere hier alle externen Datenquellen die dieser Agent nutzen darf.
# Jeder Connector braucht eine Umgebungsvariable für die URL.
#
# Format:
#   - name: connector-name
#     url_env: ENV_VAR_NAME        # Umgebungsvariable mit der MCP-Server-URL
#     description: "Was dieser Connector liefert"
#     tools_enabled: ["tool1", "tool2"]   # Optional: nur diese Tools freischalten
#     required: true/false                 # Pflicht oder optional?
#
# Governance-Regel: Nur Connectors die hier deklariert sind dürfen benutzt werden.
# Neue Connectors erfordern eine Änderung in dieser Datei (Approval-Gate).

connectors: []

