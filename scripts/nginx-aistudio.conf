# Reverse-Proxy vor AI Studio (Port 8123).
# TLS-Zertifikate und server_name anpassen. Im Produktprozess dann:
#   AISTUDIO_TRUST_PROXY=true
#   AISTUDIO_CORS_ORIGINS=https://studio.example.com
#
# server {
#   listen 80;
#   server_name studio.example.com;
#   return 301 https://$host$request_uri;
# }

upstream aistudio {
    server 127.0.0.1:8123;
}

server {
    listen 443 ssl http2;
    server_name studio.example.com;

    # ssl_certificate     /etc/letsencrypt/live/studio.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/studio.example.com/privkey.pem;

    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://aistudio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
}
