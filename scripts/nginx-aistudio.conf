# Reverse-Proxy vor AI Studio (Port 8123) — HTTP, startet ohne TLS-Zertifikat.
# In http {} einbinden, z. B. include /opt/aistudio/scripts/nginx-aistudio.conf;
# Im Produktprozess: AISTUDIO_TRUST_PROXY=true
#   AISTUDIO_ALLOWED_HOSTS=127.0.0.1,localhost,studio.example.com
#   AISTUDIO_PROXY_IPS=127.0.0.1,::1   (Host-nginx → 127.0.0.1:8123)
# Docker: Peer ist die Bridge, nicht Loopback — Gateway-IP setzen,
#   nicht 172.16.0.0/12 (jeder Container könnte X-Forwarded-For setzen).
# TLS: scripts/nginx-aistudio.tls.conf (nach certbot).

limit_req_zone $binary_remote_addr zone=aistudio_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aistudio_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=aistudio_conn:10m;

upstream aistudio {
    server 127.0.0.1:8123;
}

server {
    listen 80;
    server_name studio.example.com;

    # Produkt: Upload höchstens 8 MB, Request 10 MB. nginx 10m, damit
    # die App 413 als JSON liefert, nicht die Proxy-HTML bei 4m.
    client_max_body_size 10m;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=aistudio_login burst=5 nodelay;
        limit_conn aistudio_conn 32;
        proxy_pass http://aistudio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    # Prefix, not ^~ — otherwise login/register would skip the regex location.
    location /api/ {
        limit_req zone=aistudio_api burst=40 nodelay;
        limit_conn aistudio_conn 32;
        proxy_pass http://aistudio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location / {
        limit_conn aistudio_conn 32;
        proxy_pass http://aistudio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }
}
