name: AgentKit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install . ruff==0.15.5 coverage==7.13.5
      - run: python -m ruff check .
      - run: python -m coverage run --branch --source=agentkit,cockpit -m unittest discover -v
      - run: python -m coverage report --fail-under=75
      - if: runner.os != 'Windows'
        run: python scripts/verify_release.py
      - if: runner.os == 'Windows'
        run: python scripts/verify_release.py --windows-ocr
      - run: node scripts/test_workflow_trace.cjs
      - run: python -m agentkit init generated/smoke --profile developer --name smoke
      - run: python -m agentkit run --agent generated/smoke --backend demo --task "Offline workflow smoke"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.0
      - run: python -m bandit -q -ll -r agentkit cockpit
      - run: python -m pip_audit --strict --progress-spinner off .
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv smoke-venv
      - run: smoke-venv/bin/python -m pip install dist/company_agentkit-*.whl
      - run: smoke-venv/bin/python -m pip check
      - run: mkdir wheel-smoke-work
      - working-directory: wheel-smoke-work
        run: ../smoke-venv/bin/python -c "import agentkit; assert 'site-packages' in agentkit.__file__.replace('\\', '/')"
      - working-directory: wheel-smoke-work
        run: ../smoke-venv/bin/python -m agentkit init generated/wheel-smoke --profile developer --name wheel-smoke
      - working-directory: wheel-smoke-work
        run: ../smoke-venv/bin/python -m agentkit validate --agent generated/wheel-smoke
      - working-directory: wheel-smoke-work
        run: ../smoke-venv/bin/python -m agentkit run --agent generated/wheel-smoke --backend demo --task "Wheel installation smoke"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_ARTIFACT_DIR: ${{ runner.temp }}/agentkit-browser-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v tests.test_browser_e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-evidence
          path: ${{ runner.temp }}/agentkit-browser-evidence
          if-no-files-found: warn

