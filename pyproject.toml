[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-agentkit"
version = "0.1.0"
description = "Skill-based company agent templates with a bounded dynamic workflow"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "pypdf>=6.19,<7", "defusedxml>=0.7.1,<1", "pytest>=9.0.2,<10"]

[project.optional-dependencies]
e2e = ["playwright==1.60.0"]

[project.scripts]
agentkit = "agentkit.cli:main"

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.setuptools.package-data]
agentkit = ["library/**/*", "schemas/*.json"]

