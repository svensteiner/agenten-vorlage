services:
  aistudio:
    build: .
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      AISTUDIO_HOST: "0.0.0.0"
      AISTUDIO_PORT: "8123"
      AISTUDIO_DATA: /app/data
      AISTUDIO_ENV: ${AISTUDIO_ENV:-development}
      AISTUDIO_SECRET: ${AISTUDIO_SECRET:?AISTUDIO_SECRET muss gesetzt sein}
      AISTUDIO_ALLOW_DEMO_SEED: ${AISTUDIO_ALLOW_DEMO_SEED:-true}
      AISTUDIO_ALLOW_REGISTER: ${AISTUDIO_ALLOW_REGISTER:-true}
      AISTUDIO_LLM_PROVIDER: ${AISTUDIO_LLM_PROVIDER:-none}
      AISTUDIO_LLM_MODEL: ${AISTUDIO_LLM_MODEL:-}
      AISTUDIO_LLM_BASE_URL: ${AISTUDIO_LLM_BASE_URL:-}
      AISTUDIO_LLM_API_KEY: ${AISTUDIO_LLM_API_KEY:-}
      AISTUDIO_LLM_EGRESS: ${AISTUDIO_LLM_EGRESS:-in_boundary}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    init: true
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - aistudio-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  aistudio-data:
